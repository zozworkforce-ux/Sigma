name: Build Android APK - Sigma Lab

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        working-directory: ./android_app
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android_app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android_app/app/build/outputs/apk/debug/app-debug.apk android_app/app/build/outputs/apk/debug/SigmaLab.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sigma-Lab-APK
          path: android_app/app/build/outputs/apk/debug/SigmaLab.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Sigma Lab APK - Latest Build"
          body: |
            ## 📱 Sigma Lab - تطبيق معامل سيجما للتحاليل الطبية

            **اضغط على الملف `SigmaLab.apk` في الأسفل لتحميله وتثبيته مباشرة على هاتفك.**

            > ملاحظة: قد تحتاج لتفعيل "تثبيت تطبيقات من مصادر غير معروفة" في إعدادات الهاتف.
          files: android_app/app/build/outputs/apk/debug/SigmaLab.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
