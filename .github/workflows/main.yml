name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Build Debug APK
        working-directory: ./android_app
        run: gradle assembleDebug --no-daemon

      - name: Prepare Named APK
        run: cp android_app/app/build/outputs/apk/debug/app-debug.apk android_app/app/build/outputs/apk/debug/SigmaLab.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sigma-Lab-APK
          path: android_app/app/build/outputs/apk/debug/SigmaLab.apk

      - name: Create Direct APK Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Sigma Lab App v1.0.0"
          body: "Direct APK installation file for Sigma Lab."
          files: android_app/app/build/outputs/apk/debug/SigmaLab.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
